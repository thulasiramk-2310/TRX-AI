name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.11"
    env:
      # Tests must never depend on a running LLM.
      RD_USE_LOCAL_LLM: "false"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests with coverage
        run: python -m pytest --cov --cov-report=term --cov-report=xml
      - name: Benchmark dataset sanity check
        run: python -c "from evaluation import load_dataset; cases = load_dataset(); assert len(cases) >= 50, len(cases); print(len(cases), 'cases')"
      - name: Smoke E2E (no LLM)
        run: python smoke_e2e.py --disable-llm --min-score 10
      - name: Build and smoke-test release wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m pip wheel . --no-deps --wheel-dir build/release
          python scripts/check_release.py build/release
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

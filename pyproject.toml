[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trx-ai"
version = "0.2.0"
description = "CLI-first hybrid AI assistant for structured debugging, code review, and safe auto-fix."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "rich>=13.7.0",
    "reportlab>=4.0.0",
    "numpy>=1.26",
    "watchdog>=4.0",
    "prompt_toolkit>=3.0.43",
    "textual>=1.0",
    "Pygments>=2.20.0",
    "pillow>=12.3.0",
    "urllib3>=2.8.0",
]

[project.optional-dependencies]
# Embedding-based routing and vector memory (heavy; falls back to lexical matching without it).
semantic = ["sentence-transformers>=2.7", "faiss-cpu>=1.8"]
# Optional Supabase sync for long-term memory.
cloud = ["supabase>=2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
trx = "main:main"

[tool.setuptools.package-data]
tui = ["*.tcss"]
benchmarks = ["*.jsonl"]

[tool.setuptools]
# Runtime files use the working directory; the benchmark dataset ships in the wheel.
py-modules = [
    "analyzer",
    "cli_input",
    "cloud_memory_sync",
    "config",
    "conversation_memory",
    "embeddings",
    "evaluation",
    "formatter",
    "graph_query_adapter",
    "guardrails",
    "history",
    "intent_rules",
    "llm_client",
    "long_term_memory",
    "main",
    "mcp_graph",
    "observability",
    "personality",
    "progress",
    "router_memory",
    "rule_engine",
    "semantic_router",
    "semantic_scoring",
    "smoke_e2e",
    "smoke_questions",
    "user_profiles",
    "vector_memory",
    "watcher",
]
packages = ["tui", "benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "venv/*", ".venv/*", "build/*", "dist/*", "examples/*", "*_fixed.py"]

[tool.coverage.report]
skip_empty = true
show_missing = false

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["venv", "build", "dist", "examples", "*_fixed.py"]

[tool.ruff.lint]
# Correctness-focused set: syntax errors, pyflakes, and bugbear.
select = ["E9", "F", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# CLI loop passes lambdas to _run_with_prompt_loader, which calls them synchronously.
"main.py" = ["B023"]
